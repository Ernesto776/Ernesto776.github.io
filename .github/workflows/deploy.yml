name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - try-harder-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Check Try Harder token availability
        id: try_harder_auth
        env:
          TOKEN: ${{ secrets.TRY_HARDER_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TRY_HARDER_REPO_TOKEN secret is not set; Try Harder HTML5 bundle will be skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Try Harder (main)
        if: steps.try_harder_auth.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Ernesto776/Try-Harder-restoration-project
          ref: main
          path: .external/try-harder
          token: ${{ secrets.TRY_HARDER_REPO_TOKEN }}
          fetch-depth: 1

      - name: Setup Haxe
        if: steps.try_harder_auth.outputs.enabled == 'true'
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'

      - name: Cache Haxelib
        if: steps.try_harder_auth.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-4.3.7-lime8.3.2-openfl9.5.2-flixel6.2.1

      - name: Install pinned Haxelib dependencies
        if: steps.try_harder_auth.outputs.enabled == 'true'
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          if [ ! -d ~/haxelib/lime/8,3,2 ]; then
            haxelib install lime 8.3.2 --always --quiet
          fi
          if [ ! -d ~/haxelib/openfl/9,5,2 ]; then
            haxelib install openfl 9.5.2 --always --quiet
          fi
          if [ ! -d ~/haxelib/flixel/6,2,1 ]; then
            haxelib install flixel 6.2.1 --always --quiet
          fi
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 6.2.1

      - name: Build Try Harder HTML5
        if: steps.try_harder_auth.outputs.enabled == 'true'
        working-directory: .external/try-harder
        run: haxelib run lime build html5

      - name: Bundle Try Harder HTML5 into dist
        if: steps.try_harder_auth.outputs.enabled == 'true'
        run: |
          mkdir -p dist/games/try-harder
          cp -r .external/try-harder/export/html5/bin/. dist/games/try-harder/
          test -f dist/games/try-harder/index.html && test -f dist/games/try-harder/TryHarder.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
